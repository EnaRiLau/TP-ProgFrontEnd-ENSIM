<form #form="ngForm" (ngSubmit)="onSubmit(form)">
  <div>
    <label>Libellé</label>
    <input type="text" name="libelle" [(ngModel)]="model.libelle" required />
  </div>

  <div>
    <label>Terminé</label>
    <input type="checkbox" name="done" [(ngModel)]="model.done" />
  </div>

  <button type="submit">Ajouter</button>
</form>
